    <rect width="1200" height="800" fill="url(#grain)"/>
    <g fill="none" stroke="#c2541c" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.82">
        <path d="M380 408 600 226l220 182"/>
        <path d="M432 382v208h336V382"/>
        <path d="M552 590V470h96v120"/>
    </g>
    <g fill="#1c1916" opacity="0.7" font-family="Fraunces, Georgia, serif" text-anchor="middle">
