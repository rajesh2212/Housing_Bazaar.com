    </g>
    <g fill="#1c1916" opacity="0.42" font-family="Inter, Arial, sans-serif" text-anchor="middle">
        <text x="600" y="726" font-size="22" letter-spacing="2.4">HOUSING BAAZAR</text>
    </g>
